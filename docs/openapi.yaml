openapi: 3.0.3
info:
  title: Kennisbank API
  version: 1.8.1
  description: 'API van de Kennisbank: artikelen, zoeken, assistent, verbetervoorstellen
    en de koppeling met het zaaksysteem.'
paths:
  /api/v1/artikelen:
    get:
      operationId: v1_artikelen_list
      summary: Artikelen zoeken en filteren
      parameters:
      - in: query
        name: cluster
        schema:
          type: string
      - in: query
        name: omgeving
        schema:
          type: string
      - in: query
        name: q
        schema:
          type: string
        description: Zoektekst
      - in: query
        name: registreer
        schema:
          type: string
        description: '''1'' = zoekterm meetellen in de statistiek'
      - in: query
        name: soort
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: tag
        schema:
          type: array
          items:
            type: string
      - in: query
        name: zaaktype
        schema:
          type: string
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtikelKort'
          description: ''
  /api/v1/artikelen/{id}:
    get:
      operationId: v1_artikelen_retrieve
      summary: Eén artikel met secties
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artikel'
          description: ''
  /api/v1/artikelen/{id}/favoriet:
    put:
      operationId: v1_artikelen_favoriet_update
      summary: Favoriet aan (PUT) of uit (DELETE)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
    delete:
      operationId: v1_artikelen_favoriet_destroy
      summary: Favoriet aan (PUT) of uit (DELETE)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/artikelen/{id}/gezien:
    post:
      operationId: v1_artikelen_gezien_create
      description: 'Daarna verschijnt de melding pas weer bij een volgende inhoudelijke
        wijziging. Stuur de getoonde `versie` mee: een versie die intussen is gepubliceerd
        blijft dan als melding staan.'
      summary: Wijzigingsmelding van een artikel afvinken ('Ik snap het')
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GezienRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GezienRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GezienRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/artikelen/{id}/versies:
    get:
      operationId: v1_artikelen_versies_list
      summary: Versiegeschiedenis van een artikel (redacteuren)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtikelVersie'
          description: ''
  /api/v1/artikelen/{id}/weergave:
    post:
      operationId: v1_artikelen_weergave_create
      summary: Weergave registreren (statistiek en 'recent bezocht')
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/assistent:
    post:
      operationId: v1_assistent_create
      summary: Vraag stellen aan de assistent
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistentVraagRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssistentVraagRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssistentVraagRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistentAntwoord'
          description: ''
  /api/v1/berichten:
    get:
      operationId: v1_berichten_list
      description: 'Gepubliceerde berichten, vastgepinde eerst en dan op datum (nieuwste
        bovenaan). Verlopen berichten staan er ook in, met `verlopen: true`.'
      summary: Nieuwsberichten in de omgeving(en) van de gebruiker
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bericht'
          description: ''
  /api/v1/berichten/gezien:
    post:
      operationId: v1_berichten_gezien_create
      summary: Nieuws als gelezen markeren (de teller 'ongelezen' gaat naar nul)
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/ik:
    get:
      operationId: v1_ik_retrieve
      summary: Huidige gebruiker (GET) en voorkeuren wijzigen (PATCH)
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ik'
          description: ''
    patch:
      operationId: v1_ik_partial_update
      summary: Huidige gebruiker (GET) en voorkeuren wijzigen (PATCH)
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedIkWijzigenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedIkWijzigenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedIkWijzigenRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ik'
          description: ''
  /api/v1/keuzelijsten:
    get:
      operationId: v1_keuzelijsten_retrieve
      summary: Keuzelijsten voor filters (clusters, soorten, tags, zaaktypen)
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Keuzelijsten'
          description: ''
  /api/v1/statistieken:
    get:
      operationId: v1_statistieken_retrieve
      summary: Gebruiksstatistieken (redacteuren). Geaggregeerd, zonder persoonsgegevens.
      parameters:
      - in: query
        name: dagen
        schema:
          type: integer
        description: Periode, standaard 30
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistieken'
          description: ''
  /api/v1/voorstellen:
    get:
      operationId: v1_voorstellen_list
      summary: 'Verbetervoorstellen: lijst (GET) of indienen (POST)'
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Voorstel'
          description: ''
    post:
      operationId: v1_voorstellen_create
      summary: 'Verbetervoorstellen: lijst (GET) of indienen (POST)'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoorstelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VoorstelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VoorstelRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Voorstel'
          description: ''
  /api/v1/voorstellen/{id}:
    patch:
      operationId: v1_voorstellen_partial_update
      summary: Verbetervoorstel behandelen (redacteuren)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVoorstelBehandelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVoorstelBehandelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVoorstelBehandelRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voorstel'
          description: ''
  /api/v1/wijzigingen/gezien:
    post:
      operationId: v1_wijzigingen_gezien_create
      summary: Alle openstaande wijzigingsmeldingen afvinken ('Alles gezien')
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllesGezien'
          description: ''
  /api/v1/zaaktypen/{code}/artikelen:
    get:
      operationId: v1_zaaktypen_artikelen_list
      description: Geeft de gepubliceerde artikelen die aan dit zaaktype zijn gekoppeld.
        Gebruik `code` zoals het zaaksysteem het zaaktype identificeert.
      summary: Artikelen bij een zaaktype (voor het zaaksysteem)
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtikelKort'
          description: ''
components:
  schemas:
    AllesGezien:
      type: object
      properties:
        aantal:
          type: integer
      required:
      - aantal
    Artikel:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Leesbaar deel van de link; wordt uit de titel afgeleid. De
            link werkt op het nummer.
          pattern: ^[-a-zA-Z0-9_]+$
        titel:
          type: string
          maxLength: 200
        samenvatting:
          type: string
          description: 'Eén of twee zinnen: waar gaat dit artikel over?'
        soort:
          $ref: '#/components/schemas/SoortEnum'
        status:
          $ref: '#/components/schemas/ArtikelStatusEnum'
        omgeving:
          type: string
          readOnly: true
        clusters:
          type: array
          items:
            type: string
          readOnly: true
        tags:
          type: array
          items:
            type: string
          readOnly: true
        zaaktypen:
          type: array
          items:
            type: string
            description: De identificatie die het zaaksysteem gebruikt, bijv. de zaaktype-omschrijving
              of -code.
          readOnly: true
        versie:
          type: integer
          readOnly: true
        gepubliceerd_op:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        eigenaar:
          type: string
          maxLength: 120
        url:
          type: string
          readOnly: true
        wijziging:
          type: object
          additionalProperties: {}
          nullable: true
          description: 'De nog niet afgevinkte inhoudelijke wijziging voor de huidige
            gebruiker: {versie, datum, toelichting}.'
          readOnly: true
        blokken:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: 'De tekst in leesvolgorde: vrije tekst (altijd zichtbaar) en
            secties (in-/uitklapbaar).'
          readOnly: true
        gerelateerd:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        bewerk_url:
          type: string
          nullable: true
          readOnly: true
      required:
      - bewerk_url
      - blokken
      - clusters
      - gepubliceerd_op
      - gerelateerd
      - id
      - omgeving
      - samenvatting
      - slug
      - tags
      - titel
      - url
      - versie
      - wijziging
      - zaaktypen
    ArtikelKort:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Leesbaar deel van de link; wordt uit de titel afgeleid. De
            link werkt op het nummer.
          pattern: ^[-a-zA-Z0-9_]+$
        titel:
          type: string
          maxLength: 200
        samenvatting:
          type: string
          description: 'Eén of twee zinnen: waar gaat dit artikel over?'
        soort:
          $ref: '#/components/schemas/SoortEnum'
        status:
          $ref: '#/components/schemas/ArtikelStatusEnum'
        omgeving:
          type: string
          readOnly: true
        clusters:
          type: array
          items:
            type: string
          readOnly: true
        tags:
          type: array
          items:
            type: string
          readOnly: true
        zaaktypen:
          type: array
          items:
            type: string
            description: De identificatie die het zaaksysteem gebruikt, bijv. de zaaktype-omschrijving
              of -code.
          readOnly: true
        versie:
          type: integer
          readOnly: true
        gepubliceerd_op:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        eigenaar:
          type: string
          maxLength: 120
        url:
          type: string
          readOnly: true
        wijziging:
          type: object
          additionalProperties: {}
          nullable: true
          description: 'De nog niet afgevinkte inhoudelijke wijziging voor de huidige
            gebruiker: {versie, datum, toelichting}.'
          readOnly: true
      required:
      - clusters
      - gepubliceerd_op
      - id
      - omgeving
      - samenvatting
      - slug
      - tags
      - titel
      - url
      - versie
      - wijziging
      - zaaktypen
    ArtikelStatistiek:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        url:
          type: string
        titel:
          type: string
        soort:
          type: string
        status:
          type: string
        weergaven:
          type: integer
        voorstellen:
          type: integer
      required:
      - id
      - slug
      - soort
      - status
      - titel
      - url
      - voorstellen
      - weergaven
    ArtikelStatusEnum:
      enum:
      - concept
      - gepubliceerd
      - gearchiveerd
      type: string
      description: |-
        * `concept` - Concept
        * `gepubliceerd` - Gepubliceerd
        * `gearchiveerd` - Gearchiveerd
    ArtikelVersie:
      type: object
      properties:
        versie:
          type: integer
        gepubliceerd_op:
          type: string
          format: date-time
        gepubliceerd_door:
          type: string
          nullable: true
        toelichting:
          type: string
        kleine_correctie:
          type: boolean
        inhoud:
          type: object
          additionalProperties: {}
          description: 'Momentopname: {formaat, titel, samenvatting, inhoud, ...}'
      required:
      - gepubliceerd_door
      - gepubliceerd_op
      - inhoud
      - kleine_correctie
      - toelichting
      - versie
    AssistentAntwoord:
      type: object
      properties:
        html:
          type: string
        bronnen:
          type: array
          items: {}
        modus:
          type: string
        melding:
          type: string
      required:
      - bronnen
      - html
      - melding
      - modus
    AssistentVraagRequest:
      type: object
      properties:
        vraag:
          type: string
          minLength: 1
          maxLength: 1000
        zaaktype:
          type: string
          maxLength: 80
      required:
      - vraag
    Bericht:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        titel:
          type: string
          maxLength: 200
        tekst:
          type: string
          description: Net als artikelinhoud ook bij tonen opgeschoond (tweede linie,
            naast de opschoning bij opslaan).
          readOnly: true
        omgeving:
          type: string
          readOnly: true
        artikelen:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        vastgepind:
          type: boolean
          description: Bovenaan de nieuwspagina houden.
        gepubliceerd_op:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        verloopt_op:
          type: string
          format: date-time
          nullable: true
          description: Daarna staat het bericht onder 'Ouder nieuws' (leeg = geen
            einddatum).
        verlopen:
          type: boolean
          readOnly: true
        auteur:
          type: string
          readOnly: true
        bewerk_url:
          type: string
          nullable: true
          readOnly: true
      required:
      - artikelen
      - auteur
      - bewerk_url
      - gepubliceerd_op
      - id
      - omgeving
      - tekst
      - titel
      - verlopen
    GezienRequest:
      type: object
      properties:
        versie:
          type: integer
          minimum: 1
          description: 'De versie die de gebruiker te zien kreeg (standaard: de huidige).'
    Ik:
      type: object
      properties:
        naam:
          type: string
        is_redacteur:
          type: boolean
        onboarding:
          type: boolean
        mail_bij_favorieten:
          type: boolean
        favorieten_mail:
          type: string
          description: 'KB_FAVORIETEN_MAIL: gebundeld, direct of uit'
        nieuws_gezien_op:
          type: string
          format: date-time
          nullable: true
        nieuws_ongelezen:
          type: integer
        favorieten:
          type: array
          items:
            type: integer
          description: Artikel-id's
        recent:
          type: array
          items:
            $ref: '#/components/schemas/RecentBezocht'
        recent_max:
          type: integer
        beheer_url:
          type: string
          nullable: true
        uitlog_url:
          type: string
        ai_aan:
          type: boolean
        app_naam:
          type: string
      required:
      - ai_aan
      - app_naam
      - beheer_url
      - favorieten
      - favorieten_mail
      - is_redacteur
      - mail_bij_favorieten
      - naam
      - nieuws_gezien_op
      - nieuws_ongelezen
      - onboarding
      - recent
      - recent_max
      - uitlog_url
    Keuzelijsten:
      type: object
      properties:
        clusters:
          type: array
          items:
            type: string
        soorten:
          type: array
          items:
            $ref: '#/components/schemas/Soort'
        tags:
          type: array
          items:
            type: string
        zaaktypen:
          type: array
          items:
            $ref: '#/components/schemas/ZaaktypeKeuze'
      required:
      - clusters
      - soorten
      - tags
      - zaaktypen
    PatchedIkWijzigenRequest:
      type: object
      properties:
        onboarding:
          type: boolean
        mail_bij_favorieten:
          type: boolean
    PatchedVoorstelBehandelRequest:
      type: object
      description: 'PATCH: beide velden optioneel; wat niet wordt meegestuurd blijft
        staan.'
      properties:
        status:
          $ref: '#/components/schemas/VoorstelStatusEnum'
        terugkoppeling:
          type: string
          maxLength: 4000
    RecentBezocht:
      type: object
      properties:
        id:
          type: integer
        bezocht_op:
          type: string
          format: date-time
      required:
      - bezocht_op
      - id
    Soort:
      type: object
      properties:
        waarde:
          type: string
        label:
          type: string
      required:
      - label
      - waarde
    SoortEnum:
      enum:
      - werkinstructie
      - werkafspraak
      - proces
      type: string
      description: |-
        * `werkinstructie` - Werkinstructie
        * `werkafspraak` - Werkafspraak
        * `proces` - Proces
    Statistieken:
      type: object
      properties:
        dagen:
          type: integer
        totaal_weergaven:
          type: integer
        artikelen:
          type: array
          items:
            $ref: '#/components/schemas/ArtikelStatistiek'
        aantal_artikelen:
          type: integer
        voorstellen_totaal:
          type: integer
        voorstellen_open:
          type: integer
        voorstellen_verwerkt:
          type: integer
        zoektermen:
          type: array
          items:
            $ref: '#/components/schemas/Zoekterm'
        zoektermen_zonder_resultaat:
          type: array
          items:
            $ref: '#/components/schemas/ZoektermZonderResultaat'
        assistent_vragen:
          type: integer
        assistent_zonder_bron:
          type: integer
      required:
      - aantal_artikelen
      - artikelen
      - assistent_vragen
      - assistent_zonder_bron
      - dagen
      - totaal_weergaven
      - voorstellen_open
      - voorstellen_totaal
      - voorstellen_verwerkt
      - zoektermen
      - zoektermen_zonder_resultaat
    Voorstel:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        artikel:
          type: integer
        artikel_titel:
          type: string
          readOnly: true
        artikel_url:
          type: string
          readOnly: true
        artikel_versie:
          type: integer
          readOnly: true
          description: Versie van het artikel bij indienen.
        citaat:
          type: string
          description: De tekst die de indiener had geselecteerd.
        tekst:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/VoorstelStatusEnum'
