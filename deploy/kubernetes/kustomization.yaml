# Kennisbank op Kubernetes / OpenShift.  Toepassen:  kubectl apply -k deploy/kubernetes
# Pas image, host en configmap aan; maak het secret aan uit secret.voorbeeld.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kennisbank
labels:
  - pairs:
      app.kubernetes.io/name: kennisbank
    includeSelectors: true
resources:
  - configmap.yaml
  - migreer-job.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - opschonen-cronjob.yaml
images:
  - name: kennisbank
    newName: registry.example.nl/kennisbank
    newTag: "1.12.0"
