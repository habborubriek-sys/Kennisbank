# NIET in git met echte waarden. Aanmaken met bijv.:
#   kubectl -n kennisbank create secret generic kennisbank-geheimen \
#     --from-literal=KB_SECRET_KEY=... --from-literal=KB_DATABASE_URL=postgres://... \
#     --from-literal=KB_OIDC_CLIENT_ID=... --from-literal=KB_OIDC_CLIENT_SECRET=... ...
apiVersion: v1
kind: Secret
metadata:
  name: kennisbank-geheimen
type: Opaque
stringData:
  KB_SECRET_KEY: vervang-mij
  KB_DATABASE_URL: postgres://kennisbank:wachtwoord@postgres.example.nl:5432/kennisbank?sslmode=require
  KB_OIDC_CLIENT_ID: vervang-mij
  KB_OIDC_CLIENT_SECRET: vervang-mij
  KB_OIDC_AUTHORIZATION_ENDPOINT: https://login.microsoftonline.com/TENANT/oauth2/v2.0/authorize
  KB_OIDC_TOKEN_ENDPOINT: https://login.microsoftonline.com/TENANT/oauth2/v2.0/token
  KB_OIDC_USERINFO_ENDPOINT: https://graph.microsoft.com/oidc/userinfo
  KB_OIDC_JWKS_ENDPOINT: https://login.microsoftonline.com/TENANT/discovery/v2.0/keys
  KB_OIDC_LOGOUT_ENDPOINT: https://login.microsoftonline.com/TENANT/oauth2/v2.0/logout
  KB_BEHEERDERS_GROEPEN: object-id-beheerdersgroep
