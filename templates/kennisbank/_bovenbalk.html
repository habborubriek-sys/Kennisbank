<header class="top kb-top">
  <div class="brand"><a href="/"><span class="mark" aria-hidden="true">K</span><span>{{ app_naam }}</span></a>{% if titel %}<span class="kb-top-titel">{{ titel }}</span>{% endif %}</div>
  {% if ingelogd %}
  <nav class="topbtns" aria-label="Hoofdmenu">
    {% for k in knoppen %}<a class="tb on-accent" href="{{ k.url }}"{% if k.actief %} aria-current="page"{% endif %}>{{ k.tekst }}</a>{% endfor %}
    <form class="user" method="post" action="{{ uitlog_url }}">
      <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
      <span class="visually-hidden">Ingelogd als</span><span>{{ naam }}</span> · <button type="submit" class="kb-top-uit">Uitloggen</button>
    </form>
  </nav>
  {% endif %}
</header>
